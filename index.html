<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI橱窗 - 发现好用的AI工具与作品</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-base: #E9EFEB;
            --bg-gradient: linear-gradient(180deg, #E9EFEB 0%, #F4F7F5 100%);
            --nav-bg: rgba(244, 247, 245, 0.85);
            --text-main: #1A2B23;
            --text-sub: #5E7568;
            --text-inverse: #FFFFFF;
            --card-bg: #FFFFFF;
            --border-color: rgba(26, 43, 35, 0.08);
            --hover-shadow: 0 8px 24px -8px rgba(26, 43, 35, 0.1);
            --accent: #4C7A64;
            --accent-hover: #3B614F;
            --toggle-bg: rgba(26, 43, 35, 0.06);
            --toggle-active-bg: #FFFFFF;
            --tooltip-bg: #1A2B23;
            --tooltip-text: #FFFFFF;
            --num-color: rgba(76, 122, 100, 0.15);
            --num-hover-color: rgba(76, 122, 100, 0.8);
            --stat-bg: rgba(255, 255, 255, 0.6);
        }
        [data-theme="dark"] {
            --bg-base: #0A100D;
            --bg-gradient: linear-gradient(180deg, #0A100D 0%, #111A16 100%);
            --nav-bg: rgba(10, 16, 13, 0.85);
            --text-main: #B8D4C6;
            --text-sub: #769985;
            --text-inverse: #0A100D;
            --card-bg: #131F19;
            --border-color: rgba(184, 212, 198, 0.1);
            --hover-shadow: 0 8px 24px -8px rgba(0, 0, 0, 0.5);
            --accent: #638F78;
            --accent-hover: #7AA88E;
            --toggle-bg: rgba(184, 212, 198, 0.05);
            --toggle-active-bg: #1E3126;
            --tooltip-bg: #B8D4C6;
            --tooltip-text: #0A100D;
            --num-color: rgba(119, 185, 154, 0.15);
            --num-hover-color: rgba(119, 185, 154, 0.8);
            --stat-bg: rgba(19, 31, 25, 0.6);
        }
        [data-theme="eye"] {
            --bg-base: #DCDED1;
            --bg-gradient: linear-gradient(180deg, #DCDED1 0%, #EAECE3 100%);
            --nav-bg: rgba(234, 236, 227, 0.85);
            --text-main: #2F3629;
            --text-sub: #68705F;
            --text-inverse: #FFFFFF;
            --card-bg: #F3F5EF;
            --border-color: rgba(47, 54, 41, 0.08);
            --hover-shadow: 0 8px 24px -8px rgba(47, 54, 41, 0.1);
            --accent: #657755;
            --accent-hover: #526144;
            --toggle-bg: rgba(47, 54, 41, 0.06);
            --toggle-active-bg: #F3F5EF;
            --tooltip-bg: #2F3629;
            --tooltip-text: #FFFFFF;
            --num-color: rgba(101, 119, 85, 0.15);
            --num-hover-color: rgba(101, 119, 85, 0.8);
            --stat-bg: rgba(243, 245, 239, 0.6);
        }
        body {
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            transition: background 0.4s ease, color 0.4s ease;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }
        .glass-nav {
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            background-color: var(--nav-bg);
            border-bottom: 1px solid var(--border-color);
        }
        .logo-box {
            background-color: var(--text-main);
            color: var(--bg-base); 
            font-weight: 800;
            transition: all 0.3s ease;
        }
        .search-box {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            transition: all 0.2s ease;
        }
        .search-box:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(76, 122, 100, 0.2);
        }
        .search-box::placeholder { color: var(--text-sub); }

        .section-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            box-shadow: 0 4px 20px -10px rgba(0,0,0,0.02);
            position: relative;
            /* 关键修复：去掉 overflow: hidden，允许气泡超出 */
        }

        .item-card {
            background-color: transparent;
            border: 1px solid transparent;
            border-radius: 12px;
            transition: all 0.2s ease;
            position: relative;
            /* 关键修复：去掉 overflow: hidden */
            display: flex;
            align-items: center;
        }
        
        /* 关键修复：鼠标悬浮时，强行提升该卡片的层级，防止被相邻卡片遮挡 */
        .item-card:hover {
            background-color: var(--bg-base);
            border-color: var(--border-color);
            box-shadow: var(--hover-shadow);
            z-index: 50; 
        }

        .giant-number {
            font-family: 'Impact', 'Arial Black', sans-serif;
            font-size: 2.5rem;
            font-weight: 900;
            font-style: italic;
            line-height: 0.8;
            letter-spacing: -2px;
            color: var(--num-color);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            user-select: none;
            flex-shrink: 0;
            width: 3.5rem;
            text-align: left;
        }
        @media (min-width: 640px) {
            .giant-number {
                font-size: 3rem;
                width: 4rem;
            }
        }
        .item-card:hover .giant-number {
            color: var(--num-hover-color);
            transform: scale(1.05) translateX(2px);
        }

        .btn-primary {
            background-color: var(--accent);
            color: var(--text-inverse);
            border: 1px solid transparent;
            transition: all 0.2s ease;
        }
        .btn-primary:hover { background-color: var(--accent-hover); }
        .btn-primary:active { transform: scale(0.98); }

        .btn-secondary {
            background-color: transparent;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            transition: all 0.2s ease;
        }
        .btn-secondary:hover { background-color: var(--toggle-bg); }
        .btn-secondary:active { transform: scale(0.98); }

        .pulse-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background-color: var(--accent);
            box-shadow: 0 0 0 0 rgba(76, 122, 100, 0.7);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(76, 122, 100, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 5px rgba(76, 122, 100, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(76, 122, 100, 0); }
        }

        .theme-switch {
            display: flex;
            background-color: var(--toggle-bg);
            border-radius: 12px;
            padding: 3px;
            border: 1px solid var(--border-color);
        }
        .theme-btn {
            width: 32px;
            height: 28px;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-sub);
            transition: all 0.25s ease;
            cursor: pointer;
        }
        .theme-btn:hover { color: var(--text-main); }
        .theme-btn.active {
            background-color: var(--toggle-active-bg);
            color: var(--text-main);
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        [data-theme="dark"] .theme-btn.active {
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        /* 气泡修复 */
        .tooltip-container { position: relative; }
        .tooltip-text {
            visibility: hidden;
            opacity: 0;
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%) translateY(8px);
            background-color: var(--tooltip-bg);
            color: var(--tooltip-text);
            text-align: center;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 500;
            line-height: 1.4;
            white-space: normal;
            width: max-content;
            max-width: 220px; /* 限制最大宽度 */
            z-index: 9999; /* 极高的层级，保证在最高层 */
            transition: opacity 0.2s ease, transform 0.2s ease;
            pointer-events: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }
        .tooltip-text::after {
            content: "";
            position: absolute;
            top: 100%;
            left: 50%;
            margin-left: -5px;
            border-width: 5px;
            border-style: solid;
            border-color: var(--tooltip-bg) transparent transparent transparent;
        }
        .tooltip-container:hover .tooltip-text {
            visibility: visible;
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body class="pb-20">

    <header class="sticky top-0 z-50 glass-nav">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 h-14 flex items-center justify-between gap-4">
            <div class="flex items-center gap-3 flex-shrink-0">
                <div class="w-8 h-8 rounded-lg flex items-center justify-center text-base logo-box">AI</div>
                <h1 class="text-lg font-bold tracking-tight hidden sm:block">AI橱窗</h1>
            </div>
            
            <div class="flex items-center gap-3">
                <div class="theme-switch flex-shrink-0">
                    <button onclick="setTheme('light', this)" class="theme-btn active" title="白天模式">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                    </button>
                    <button onclick="setTheme('dark', this)" class="theme-btn" title="夜晚模式">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                    </button>
                    <button onclick="setTheme('eye', this)" class="theme-btn" title="护眼模式">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                    </button>
                </div>
                <button onclick="openSubmitModal()" class="btn-primary px-4 py-1.5 rounded-lg font-bold text-sm hidden sm:flex items-center gap-1.5">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    提交工具
                </button>
            </div>
        </div>
    </header>

    <section class="max-w-4xl mx-auto px-4 pt-10 pb-6 text-center">
        <div class="relative max-w-2xl mx-auto mb-10">
            <svg class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 opacity-40" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            <input type="text" id="searchInput" placeholder="按名称、描述或标签搜索 AI 工具..." class="search-box w-full pl-12 pr-4 py-3.5 rounded-2xl text-base focus:outline-none shadow-sm">
        </div>

        <div class="flex items-center justify-center gap-8 sm:gap-16">
            <div class="flex flex-col items-center">
                <span class="text-3xl font-black" style="color: var(--text-main);" id="statTools">0</span>
                <span class="text-xs font-medium mt-1" style="color: var(--text-sub);">工具总数</span>
            </div>
            <div class="w-px h-8" style="background: var(--border-color);"></div>
            <div class="flex flex-col items-center">
                <span class="text-3xl font-black" style="color: var(--text-main);" id="statWorks">0</span>
                <span class="text-xs font-medium mt-1" style="color: var(--text-sub);">作品总数</span>
            </div>
            <div class="w-px h-8" style="background: var(--border-color);"></div>
            <div class="flex flex-col items-center">
                <span class="text-3xl font-black" style="color: var(--text-main);" id="statViews">0</span>
                <span class="text-xs font-medium mt-1" style="color: var(--text-sub);">累计浏览</span>
            </div>
        </div>
    </section>

    <main class="flex-grow max-w-6xl mx-auto w-full px-4 sm:px-6 py-2 space-y-5">
        
        <section class="section-card p-5 sm:p-6">
            <div class="flex flex-col md:flex-row gap-6 items-center">
                <div class="w-full md:w-5/12 flex flex-col justify-center">
                    <span class="text-[11px] font-bold tracking-wider uppercase mb-2" style="color: var(--accent);">站长作品</span>
                    <h2 class="text-2xl sm:text-3xl font-extrabold mb-3 leading-tight tracking-tight">我的 AI 独立实验室</h2>
                    <p class="text-xs leading-relaxed mb-5" style="color: var(--text-sub);">
                        纯手工打造，专为寻找好工具的你。收录免注册神器，也是大家展示创意的角落。
                    </p>
                    <div class="flex gap-2">
                        <a href="https://mindfeed2.pages.dev/" target="_blank" class="btn-primary px-5 py-2 rounded-lg font-bold text-xs flex items-center justify-center gap-1">
                            访问主站 <span class="text-sm leading-none">↗</span>
                        </a>
                        <button onclick="openSubmitModal()" class="btn-secondary px-5 py-2 rounded-lg font-bold text-xs">
                            提交作品
                        </button>
                    </div>
                </div>
                
                <div class="w-full md:w-7/12">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2" id="myWorksGrid">
                        <div class="text-center py-6 opacity-50 text-xs w-full col-span-full">加载数据中...</div>
                    </div>
                    <div class="mt-4 flex items-center justify-center gap-2">
                        <div class="pulse-dot"></div>
                        <span class="text-[10px] font-medium tracking-widest" style="color: var(--text-sub);">持续创作中 · 敬请期待</span>
                    </div>
                </div>
            </div>
        </section>

        <div class="grid grid-cols-1 md:grid-cols-12 gap-5">
            <div class="md:col-span-5 md:order-last">
                <section class="section-card p-4 h-full flex flex-col">
                    <div class="mb-3">
                        <h2 class="text-base font-bold">AI 脑洞橱窗</h2>
                        <p class="text-[11px] mt-0.5" style="color: var(--text-sub);">网友用 AI 搞出的创意</p>
                    </div>
                    <div class="space-y-1 flex-grow" id="showcaseGrid">
                        <!-- JS 渲染 -->
                    </div>
                </section>
            </div>

            <div class="md:col-span-7">
                <section class="section-card p-4 h-full">
                    <div class="mb-3 flex justify-between items-end">
                        <div>
                            <h2 class="text-base font-bold">常用工具收藏夹</h2>
                            <p class="text-[11px] mt-0.5" style="color: var(--text-sub);">点击直达，悬停查看简介</p>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 sm:grid-cols-3 gap-2" id="toolsGrid">
                        <!-- JS 渲染 -->
                    </div>
                </section>
            </div>
        </div>
    </main>

    <footer class="w-full py-5 mt-2">
        <p class="text-[11px] font-medium text-center opacity-40">
            &copy; <span id="currentYear">2026</span> 方塘 Mindfeed. 保留所有权利。
        </p>
    </footer>

    <div class="fixed bottom-6 right-6 z-40">
        <button onclick="openSubmitModal()" class="btn-primary w-12 h-12 rounded-full flex items-center justify-center shadow-md">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
        </button>
    </div>

    <div id="submitModal" class="fixed inset-0 bg-black/40 hidden items-center justify-center z-[100] p-4 backdrop-blur-sm">
        <div class="rounded-2xl w-full max-w-md overflow-hidden shadow-2xl border" style="background: var(--card-bg); border-color: var(--border-color);">
            <div class="px-5 py-4 border-b flex justify-between items-center" style="border-color: var(--border-color);">
                <h3 class="font-bold text-base">✨ 分享你的 AI 作品</h3>
                <button onclick="closeSubmitModal()" class="text-xl leading-none opacity-50 hover:opacity-100 transition-opacity">&times;</button>
            </div>
            <form onsubmit="handleSubmit(event)" class="p-5 space-y-3">
                <div>
                    <label class="block text-xs font-bold mb-1.5">网站名称</label>
                    <input type="text" required class="w-full px-3 py-2 rounded-lg text-sm border focus:outline-none" style="background: var(--bg-base); border-color: var(--border-color); color: var(--text-main);" placeholder="给你的网站起个名字">
                </div>
                <div>
                    <label class="block text-xs font-bold mb-1.5">网站地址 (URL)</label>
                    <input type="url" required class="w-full px-3 py-2 rounded-lg text-sm border focus:outline-none" style="background: var(--bg-base); border-color: var(--border-color); color: var(--text-main);" placeholder="https://...">
                </div>
                <div>
                    <label class="block text-xs font-bold mb-1.5">一句话简介</label>
                    <textarea required rows="2" class="w-full px-3 py-2 rounded-lg text-sm border focus:outline-none" style="background: var(--bg-base); border-color: var(--border-color); color: var(--text-main);" placeholder="用一句话介绍它的特色..."></textarea>
                </div>
                <button type="submit" class="btn-primary w-full py-2.5 rounded-lg font-bold text-sm mt-1">确认提交</button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('currentYear').textContent = new Date().getFullYear();

        function setTheme(theme, btn) {
            document.documentElement.setAttribute('data-theme', theme);
            document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            localStorage.setItem('ai-showcase-theme', theme);
        }
        
        const savedTheme = localStorage.getItem('ai-showcase-theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        setTimeout(() => {
            const btns = document.querySelectorAll('.theme-btn');
            if (savedTheme === 'light') btns[0]?.classList.add('active');
            if (savedTheme === 'dark') btns[1]?.classList.add('active');
            if (savedTheme === 'eye') btns[2]?.classList.add('active');
        }, 50);

        async function fetchStats() {
            try {
                const res = await fetch('/api/stats');
                const json = await res.json();
                if (!json.success) return;
                const { tools, works, ideas, totalViews } = json.data;
                
                animateValue('statTools', 0, tools, 1000);
                animateValue('statWorks', 0, works + ideas, 1000);
                animateValue('statViews', 0, totalViews, 1000);
            } catch (e) { console.error('获取统计失败', e); }
        }

        function animateValue(id, start, end, duration) {
            const obj = document.getElementById(id);
            if (!obj) return;
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                obj.innerHTML = Math.floor(progress * (end - start) + start);
                if (progress < 1) {
                    window.requestAnimationFrame(step);
                } else {
                    obj.innerHTML = end;
                }
            };
            window.requestAnimationFrame(step);
        }

        async function trackHit(id, type) {
            try {
                await fetch('/api/hit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id, type })
                });
            } catch (e) { console.error('统计失败'); }
        }

        function handleOpen(url, id, type) {
            if (id) trackHit(id, type);
            window.open(url, '_blank');
        }

        async function fetchWorks() {
            try {
                const res = await fetch('/api/works');
                const json = await res.json();
                if (!json.success || !json.data.length) return;
                
                const grid = document.getElementById('myWorksGrid');
                grid.innerHTML = json.data.map((item, index) => {
                    const numStr = (index + 1).toString().padStart(2, '0');
                    const views = item.views || 0;
                    
                    return `
                    <div class="item-card p-3 cursor-pointer" onclick="handleOpen('${item.url}', ${item.id}, 'works')">
                        <div class="flex items-center gap-3">
                            <div class="giant-number">${numStr}</div>
                            <div class="flex-1 min-w-0">
                                <div class="flex items-center justify-between mb-0.5">
                                    <h3 class="text-sm font-bold truncate flex items-center gap-1.5">
                                        <span>${item.icon}</span> ${item.name}
                                    </h3>
                                    <span class="text-[10px] font-medium opacity-40">${views} 浏览</span>
                                </div>
                                <p class="text-xs truncate" style="color: var(--text-sub);">${item.description}</p>
                            </div>
                        </div>
                    </div>
                `}).join('');
            } catch (e) { 
                console.error('获取作品失败', e);
                document.getElementById('myWorksGrid').innerHTML = `<div class="text-center py-6 opacity-50 text-xs w-full col-span-full">暂无作品数据</div>`;
            }
        }

        async function fetchIdeas() {
            try {
                const res = await fetch('/api/ideas');
                const json = await res.json();
                
                const grid = document.getElementById('showcaseGrid');
                let html = '';
                
                if (json.success && json.data.length > 0) {
                    html = json.data.map((item, index) => {
                        const views = item.views || 0;
                        const numStr = (index + 1).toString().padStart(2, '0');
                        return `
                        <div class="item-card p-2.5 cursor-pointer" onclick="handleOpen('${item.url}', ${item.id}, 'ideas')">
                            <div class="flex items-center gap-3">
                                <div class="giant-number" style="font-size: 2.2rem; width: 3rem;">${numStr}</div>
                                <div class="w-8 h-8 rounded-lg flex items-center justify-center text-lg flex-shrink-0" style="background: var(--bg-base);">${item.icon}</div>
                                <div class="flex-1 min-w-0 flex flex-col justify-center">
                                    <div class="flex items-center justify-between">
                                        <h3 class="text-sm font-bold truncate">${item.name}</h3>
                                        <span class="text-[10px] font-medium opacity-40">${views} 浏览</span>
                                    </div>
                                    <p class="text-[11px] mt-0.5 line-clamp-2" style="color: var(--text-sub);">${item.description}</p>
                                </div>
                            </div>
                        </div>
                    `}).join('');
                }
                
                html += `
                    <div class="mt-2 p-3 rounded-xl border border-dashed flex flex-col items-center justify-center cursor-pointer transition-all hover:bg-black/5 dark:hover:bg-white/5" 
                         style="border-color: var(--border-color);" onclick="openSubmitModal()">
                        <div class="w-6 h-6 rounded-full flex items-center justify-center mb-1.5" style="background: var(--bg-base); color: var(--accent);">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                        </div>
                        <span class="text-xs font-bold" style="color: var(--accent);">欢迎录入您的作品</span>
                    </div>
                `;
                
                grid.innerHTML = html;
            } catch (e) { console.error('获取脑洞失败', e); }
        }

        async function fetchTools() {
            try {
                const res = await fetch('/api/tools');
                const json = await res.json();
                if (!json.success) return;
                
                let allTools = [];
                json.data.forEach(folder => {
                    allTools = allTools.concat(folder.tools);
                });

                const container = document.getElementById('toolsGrid');
                if (allTools.length === 0) {
                    container.innerHTML = `<div class="text-center py-6 opacity-50 text-xs w-full col-span-full">暂无工具数据</div>`;
                    return;
                }

                container.innerHTML = allTools.map(tool => `
                    <div class="item-card tooltip-container p-2.5 flex flex-col justify-center cursor-pointer relative" onclick="window.open('${tool.url}', '_blank')">
                        <div class="flex items-center gap-1.5 mb-1">
                            <div class="text-base flex-shrink-0">${tool.icon}</div>
                            <div class="text-xs font-bold truncate">${tool.name}</div>
                        </div>
                        <div class="text-[10px] truncate" style="color: var(--text-sub);">${tool.description}</div>
                        <div class="tooltip-text">${tool.description}</div>
                    </div>
                `).join('');
            } catch (e) { console.error('获取工具失败', e); }
        }

        function openSubmitModal() {
            document.getElementById('submitModal').classList.remove('hidden');
            document.getElementById('submitModal').classList.add('flex');
        }
        function closeSubmitModal() {
            document.getElementById('submitModal').classList.add('hidden');
            document.getElementById('submitModal').classList.remove('flex');
        }

        async function handleSubmit(e) {
            e.preventDefault();
            const form = e.target;
            const name = form.querySelector('input[type="text"]').value;
            const url = form.querySelector('input[type="url"]').value;
            const desc = form.querySelector('textarea').value;

            const res = await fetch('/api/submit', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, url, desc })
            });
            const json = await res.json();

            if (json.success) {
                alert('提交成功！等待站长审核后将展示在橱窗中。');
                form.reset();
                closeSubmitModal();
            } else {
                alert('提交失败：' + (json.error || '请稍后重试'));
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            fetchStats();
            fetchWorks();
            fetchIdeas();
            fetchTools();
        });
    </script>
</body>
</html>
