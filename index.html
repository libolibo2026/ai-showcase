<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI橱窗 - 发现好用的AI工具与作品</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-base: #E9EFEB;
            --bg-gradient: linear-gradient(180deg, #E9EFEB 0%, #F4F7F5 100%);
            --nav-bg: rgba(244, 247, 245, 0.85);
            --text-main: #1A2B23;
            --text-sub: #5E7568;
            --text-inverse: #FFFFFF;
            --card-bg: #FFFFFF;
            --border-color: rgba(26, 43, 35, 0.08);
            --hover-shadow: 0 8px 24px -8px rgba(26, 43, 35, 0.1);
            --accent: #4C7A64;
            --accent-hover: #3B614F;
            --toggle-bg: rgba(26, 43, 35, 0.06);
            --toggle-active-bg: #FFFFFF;
            --tooltip-bg: #1A2B23;
            --tooltip-text: #FFFFFF;
        }
        [data-theme="dark"] {
            --bg-base: #0A100D;
            --bg-gradient: linear-gradient(180deg, #0A100D 0%, #111A16 100%);
            --nav-bg: rgba(10, 16, 13, 0.85);
            --text-main: #B8D4C6;
            --text-sub: #769985;
            --text-inverse: #0A100D;
            --card-bg: #131F19;
            --border-color: rgba(184, 212, 198, 0.1);
            --hover-shadow: 0 8px 24px -8px rgba(0, 0, 0, 0.5);
            --accent: #638F78;
            --accent-hover: #7AA88E;
            --toggle-bg: rgba(184, 212, 198, 0.05);
            --toggle-active-bg: #1E3126;
            --tooltip-bg: #B8D4C6;
            --tooltip-text: #0A100D;
        }
        [data-theme="eye"] {
            --bg-base: #DCDED1;
            --bg-gradient: linear-gradient(180deg, #DCDED1 0%, #EAECE3 100%);
            --nav-bg: rgba(234, 236, 227, 0.85);
            --text-main: #2F3629;
            --text-sub: #68705F;
            --text-inverse: #FFFFFF;
            --card-bg: #F3F5EF;
            --border-color: rgba(47, 54, 41, 0.08);
            --hover-shadow: 0 8px 24px -8px rgba(47, 54, 41, 0.1);
            --accent: #657755;
            --accent-hover: #526144;
            --toggle-bg: rgba(47, 54, 41, 0.06);
            --toggle-active-bg: #F3F5EF;
            --tooltip-bg: #2F3629;
            --tooltip-text: #FFFFFF;
        }
        body {
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            transition: background 0.4s ease, color 0.4s ease;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }
        .glass-nav {
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            background-color: var(--nav-bg);
            border-bottom: 1px solid var(--border-color);
        }
        .logo-box {
            background-color: var(--text-main);
            color: var(--bg-base); 
            font-weight: 800;
            transition: all 0.3s ease;
        }
        .search-box {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            transition: all 0.2s ease;
        }
        .search-box:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(76, 122, 100, 0.2);
        }
        .search-box::placeholder { color: var(--text-sub); }

        .section-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            box-shadow: 0 4px 20px -10px rgba(0,0,0,0.02);
            position: relative;
            overflow: hidden;
        }

        .item-card {
            background-color: transparent;
            border: 1px solid transparent;
            border-radius: 16px;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }
        .item-card:hover {
            background-color: var(--bg-base);
            border-color: var(--border-color);
            transform: translateY(-2px);
            box-shadow: var(--hover-shadow);
        }

        /* 大号编号背景字 */
        .bg-number {
            position: absolute;
            right: -5px;
            bottom: -20px;
            font-size: 6rem;
            font-weight: 900;
            font-family: "Oswald", "Impact", sans-serif;
            color: var(--text-main);
            opacity: 0.04;
            line-height: 1;
            pointer-events: none;
            transition: all 0.3s ease;
            letter-spacing: -2px;
        }
        .item-card:hover .bg-number {
            opacity: 0.08;
            transform: scale(1.05) translate(-2px, -2px);
        }

        .btn-primary {
            background-color: var(--accent);
            color: var(--text-inverse);
            border: 1px solid transparent;
            transition: all 0.2s ease;
        }
        .btn-primary:hover { background-color: var(--accent-hover); }
        .btn-primary:active { transform: scale(0.98); }

        .btn-secondary {
            background-color: transparent;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            transition: all 0.2s ease;
        }
        .btn-secondary:hover { background-color: var(--toggle-bg); }
        .btn-secondary:active { transform: scale(0.98); }

        /* 脉冲动效 (持续创作中) */
        .pulse-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: var(--accent);
            box-shadow: 0 0 0 0 rgba(76, 122, 100, 0.7);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(76, 122, 100, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(76, 122, 100, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(76, 122, 100, 0); }
        }

        .theme-switch {
            display: flex;
            background-color: var(--toggle-bg);
            border-radius: 12px;
            padding: 3px;
            border: 1px solid var(--border-color);
        }
        .theme-btn {
            width: 32px;
            height: 28px;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-sub);
            transition: all 0.25s ease;
            cursor: pointer;
        }
        .theme-btn:hover { color: var(--text-main); }
        .theme-btn.active {
            background-color: var(--toggle-active-bg);
            color: var(--text-main);
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        [data-theme="dark"] .theme-btn.active {
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        .tooltip-container { position: relative; }
        .tooltip-text {
            visibility: hidden;
            opacity: 0;
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%) translateY(8px);
            background-color: var(--tooltip-bg);
            color: var(--tooltip-text);
            text-align: center;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 500;
            line-height: 1.5;
            white-space: normal;
            width: max-content;
            max-width: 240px;
            z-index: 50;
            transition: opacity 0.2s cubic-bezier(0.4, 0, 0.2, 1), transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.2);
        }
        .tooltip-text::after {
            content: "";
            position: absolute;
            top: 100%;
            left: 50%;
            margin-left: -5px;
            border-width: 5px;
            border-style: solid;
            border-color: var(--tooltip-bg) transparent transparent transparent;
        }
        .tooltip-container:hover .tooltip-text {
            visibility: visible;
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body class="pb-24">

    <header class="sticky top-0 z-50 glass-nav">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-4">
            <div class="flex items-center gap-3 flex-shrink-0">
                <div class="w-9 h-9 rounded-xl flex items-center justify-center text-lg logo-box">AI</div>
                <h1 class="text-xl font-bold tracking-tight hidden sm:block">AI橱窗</h1>
            </div>
            
            <div class="relative flex-1 max-w-[280px] sm:max-w-md">
                <svg class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                <input type="text" id="searchInput" placeholder="搜索工具或网站..." class="search-box w-full pl-10 pr-4 py-2 rounded-xl text-sm focus:outline-none">
            </div>

            <div class="theme-switch flex-shrink-0">
                <button onclick="setTheme('light', this)" class="theme-btn active" title="白天模式">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                </button>
                <button onclick="setTheme('dark', this)" class="theme-btn" title="夜晚模式">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                </button>
                <button onclick="setTheme('eye', this)" class="theme-btn" title="护眼模式">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-6xl mx-auto w-full px-4 sm:px-6 py-8 space-y-6">
        
        <!-- 站长作品区 -->
        <section class="section-card p-6 sm:p-10">
            <div class="flex flex-col md:flex-row gap-10 items-center">
                <div class="w-full md:w-5/12 flex flex-col justify-center">
                    <span class="text-xs font-bold tracking-wider uppercase mb-3" style="color: var(--accent);">站长作品</span>
                    <h2 class="text-3xl sm:text-4xl font-extrabold mb-4 leading-tight tracking-tight">我的 AI 独立实验室</h2>
                    <p class="text-sm leading-relaxed mb-8" style="color: var(--text-sub);">
                        纯手工打造，专为寻找好工具的你。收录免注册神器，也是大家展示创意的角落。
                    </p>
                    <div class="flex gap-3">
                        <a href="https://mindfeed2.pages.dev/" target="_blank" class="btn-primary px-6 py-2.5 rounded-xl font-bold text-sm flex items-center justify-center gap-1">
                            访问主站 <span class="text-lg leading-none">↗</span>
                        </a>
                        <button onclick="openSubmitModal()" class="btn-secondary px-6 py-2.5 rounded-xl font-bold text-sm">
                            提交作品
                        </button>
                    </div>
                </div>
                
                <!-- 我的作品网格 -->
                <div class="w-full md:w-7/12">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3" id="myWorksGrid">
                        <div class="text-center py-10 opacity-50 text-sm w-full col-span-full">加载数据中...</div>
                    </div>
                    <!-- 持续创作中提示 -->
                    <div class="mt-4 flex items-center justify-center gap-2">
                        <div class="pulse-dot"></div>
                        <span class="text-xs font-medium tracking-widest" style="color: var(--text-sub);">持续创作中 · 敬请期待</span>
                    </div>
                </div>
            </div>
        </section>

        <div class="grid grid-cols-1 md:grid-cols-12 gap-6">
            <!-- AI 脑洞橱窗 -->
            <div class="md:col-span-5 md:order-last">
                <section class="section-card p-5 h-full">
                    <div class="mb-5">
                        <h2 class="text-lg font-bold">AI 脑洞橱窗</h2>
                        <p class="text-xs mt-1" style="color: var(--text-sub);">网友用 AI 搞出的创意</p>
                    </div>
                    <div class="space-y-3" id="showcaseGrid">
                        <!-- JS 渲染 -->
                    </div>
                </section>
            </div>

            <!-- 常用工具收藏夹 -->
            <div class="md:col-span-7">
                <section class="section-card p-5 h-full">
                    <div class="mb-5 flex justify-between items-end">
                        <div>
                            <h2 class="text-lg font-bold">常用工具收藏夹</h2>
                            <p class="text-xs mt-1" style="color: var(--text-sub);">点击直达，悬停查看简介</p>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 sm:grid-cols-3 gap-2.5" id="toolsGrid">
                        <!-- JS 渲染 -->
                    </div>
                </section>
            </div>
        </div>
    </main>

    <footer class="w-full py-10 mt-auto border-t" style="border-color: var(--border-color);">
        <div class="max-w-6xl mx-auto px-4 flex flex-col items-center justify-center gap-3">
            <div class="flex items-center gap-2">
                <div class="w-7 h-7 rounded-lg flex items-center justify-center font-bold text-xs bg-emerald-600 text-white shadow-sm">
                    方
                </div>
                <span class="text-sm font-bold tracking-wide">方塘 Mindfeed</span>
            </div>
            <p class="text-xs font-medium opacity-60">
                &copy; <span id="currentYear">2026</span> 方塘 Mindfeed. 保留所有权利。
            </p>
        </div>
    </footer>

    <div class="fixed bottom-8 right-8 z-40">
        <button onclick="openSubmitModal()" class="btn-primary w-14 h-14 rounded-full flex items-center justify-center shadow-lg">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
        </button>
    </div>

    <!-- 提交弹窗 -->
    <div id="submitModal" class="fixed inset-0 bg-black/40 hidden items-center justify-center z-[100] p-4 backdrop-blur-sm">
        <div class="rounded-3xl w-full max-w-lg overflow-hidden shadow-2xl border" style="background: var(--card-bg); border-color: var(--border-color);">
            <div class="px-6 py-5 border-b flex justify-between items-center" style="border-color: var(--border-color);">
                <h3 class="font-bold text-lg">✨ 分享你的 AI 作品</h3>
                <button onclick="closeSubmitModal()" class="text-2xl leading-none opacity-50 hover:opacity-100 transition-opacity">&times;</button>
            </div>
            <form onsubmit="handleSubmit(event)" class="p-6 space-y-4">
                <div>
                    <label class="block text-sm font-bold mb-2">网站名称</label>
                    <input type="text" required class="w-full px-4 py-2.5 rounded-xl text-sm border focus:outline-none" style="background: var(--bg-base); border-color: var(--border-color); color: var(--text-main);" placeholder="给你的网站起个名字">
                </div>
                <div>
                    <label class="block text-sm font-bold mb-2">网站地址 (URL)</label>
                    <input type="url" required class="w-full px-4 py-2.5 rounded-xl text-sm border focus:outline-none" style="background: var(--bg-base); border-color: var(--border-color); color: var(--text-main);" placeholder="https://...">
                </div>
                <div>
                    <label class="block text-sm font-bold mb-2">一句话简介</label>
                    <textarea required rows="3" class="w-full px-4 py-2.5 rounded-xl text-sm border focus:outline-none" style="background: var(--bg-base); border-color: var(--border-color); color: var(--text-main);" placeholder="用一句话介绍它的特色..."></textarea>
                </div>
                <button type="submit" class="btn-primary w-full py-3 rounded-xl font-bold text-base mt-2">确认提交</button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('currentYear').textContent = new Date().getFullYear();

        function setTheme(theme, btn) {
            document.documentElement.setAttribute('data-theme', theme);
            document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            localStorage.setItem('ai-showcase-theme', theme);
        }
        
        const savedTheme = localStorage.getItem('ai-showcase-theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        setTimeout(() => {
            const btns = document.querySelectorAll('.theme-btn');
            if (savedTheme === 'light') btns[0]?.classList.add('active');
            if (savedTheme === 'dark') btns[1]?.classList.add('active');
            if (savedTheme === 'eye') btns[2]?.classList.add('active');
        }, 50);

        // 记录点击量工具函数
        async function trackHit(id, type) {
            try {
                await fetch('/api/hit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id, type })
                });
            } catch (e) { console.error('统计失败'); }
        }

        // 统一的打开链接函数
        function handleOpen(url, id, type) {
            if (id) trackHit(id, type); // 静默统计
            window.open(url, '_blank');
        }

        async function fetchWorks() {
            try {
                const res = await fetch('/api/works');
                const json = await res.json();
                if (!json.success || !json.data.length) return;
                
                const grid = document.getElementById('myWorksGrid');
                grid.innerHTML = json.data.map((item, index) => {
                    // 生成 01, 02 编号
                    const numStr = (index + 1).toString().padStart(2, '0');
                    // 如果没有 views 字段，默认显示 0
                    const views = item.views || 0;
                    
                    return `
                    <div class="item-card p-4 cursor-pointer flex flex-col justify-center" onclick="handleOpen('${item.url}', ${item.id}, 'works')">
                        <!-- 大号编号 -->
                        <div class="bg-number">${numStr}</div>
                        
                        <div class="flex items-center justify-between mb-1 relative z-10">
                            <div class="flex items-center gap-2 max-w-[70%]">
                                <div class="text-lg flex-shrink-0">${item.icon}</div>
                                <h3 class="text-sm font-bold truncate">${item.name}</h3>
                            </div>
                            <span class="text-[10px] font-mono opacity-50 flex items-center gap-0.5">
                                👁️ ${views}
                            </span>
                        </div>
                        <p class="text-xs line-clamp-1 relative z-10" style="color: var(--text-sub);">${item.description}</p>
                    </div>
                `}).join('');
            } catch (e) { 
                console.error('获取作品失败', e);
                document.getElementById('myWorksGrid').innerHTML = `<div class="text-center py-10 opacity-50 text-sm w-full col-span-full">暂无作品数据</div>`;
            }
        }

        async function fetchIdeas() {
            try {
                const res = await fetch('/api/ideas');
                const json = await res.json();
                
                const grid = document.getElementById('showcaseGrid');
                let html = '';
                
                if (json.success && json.data.length > 0) {
                    html = json.data.map(item => {
                        const views = item.views || 0;
                        return `
                        <div class="item-card p-3 flex gap-3 cursor-pointer relative" onclick="handleOpen('${item.url}', ${item.id}, 'ideas')">
                            <div class="w-10 h-10 rounded-xl flex items-center justify-center text-xl flex-shrink-0" style="background: var(--bg-base);">${item.icon}</div>
                            <div class="flex-1 min-w-0 flex flex-col justify-center">
                                <div class="flex items-center justify-between">
                                    <h3 class="text-sm font-bold truncate">${item.name}</h3>
                                    <span class="text-[10px] font-mono opacity-50">👁️ ${views}</span>
                                </div>
                                <p class="text-[11px] mt-0.5 line-clamp-2" style="color: var(--text-sub);">${item.description}</p>
                            </div>
                        </div>
                    `}).join('');
                }
                
                // 追加“欢迎录入”卡片
                html += `
                    <div class="mt-4 p-4 rounded-2xl border-2 border-dashed flex flex-col items-center justify-center cursor-pointer transition-all hover:bg-black/5 dark:hover:bg-white/5" 
                         style="border-color: var(--border-color);" onclick="openSubmitModal()">
                        <div class="w-8 h-8 rounded-full flex items-center justify-center mb-2" style="background: var(--bg-base); color: var(--accent);">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                        </div>
                        <span class="text-sm font-bold" style="color: var(--accent);">欢迎录入您的作品</span>
                    </div>
                `;
                
                grid.innerHTML = html;
            } catch (e) { console.error('获取脑洞失败', e); }
        }

        async function fetchTools() {
            try {
                const res = await fetch('/api/tools');
                const json = await res.json();
                if (!json.success) return;
                
                let allTools = [];
                json.data.forEach(folder => {
                    allTools = allTools.concat(folder.tools);
                });

                const container = document.getElementById('toolsGrid');
                if (allTools.length === 0) {
                    container.innerHTML = `<div class="text-center py-10 opacity-50 text-sm w-full col-span-full">暂无工具数据</div>`;
                    return;
                }

                container.innerHTML = allTools.map(tool => `
                    <div class="item-card tooltip-container p-3 flex flex-col justify-center cursor-pointer relative" onclick="window.open('${tool.url}', '_blank')">
                        <div class="flex items-center gap-2 mb-1.5">
                            <div class="text-lg flex-shrink-0">${tool.icon}</div>
                            <div class="text-sm font-bold truncate">${tool.name}</div>
                        </div>
                        <div class="text-[11px] truncate" style="color: var(--text-sub);">${tool.description}</div>
                        <div class="tooltip-text">${tool.description}</div>
                    </div>
                `).join('');
            } catch (e) { console.error('获取工具失败', e); }
        }

        function openSubmitModal() {
            document.getElementById('submitModal').classList.remove('hidden');
            document.getElementById('submitModal').classList.add('flex');
        }
        function closeSubmitModal() {
            document.getElementById('submitModal').classList.add('hidden');
            document.getElementById('submitModal').classList.remove('flex');
        }

        async function handleSubmit(e) {
            e.preventDefault();
            const form = e.target;
            const name = form.querySelector('input[type="text"]').value;
            const url = form.querySelector('input[type="url"]').value;
            const desc = form.querySelector('textarea').value;

            const res = await fetch('/api/submit', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, url, desc })
            });
            const json = await res.json();

            if (json.success) {
                alert('提交成功！等待站长审核后将展示在橱窗中。');
                form.reset();
                closeSubmitModal();
            } else {
                alert('提交失败：' + (json.error || '请稍后重试'));
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            fetchWorks();
            fetchIdeas();
            fetchTools();
        });
    </script>
</body>
</html>
